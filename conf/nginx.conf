# AgentMux — OpenResty nginx config (dev-biased v0.1).
# Production tuning lives in docs/OPERATIONS.md (week 4).

worker_processes  1;
error_log         logs/error.log info;
pid               run/nginx.pid;

# nginx clears the worker environment by default (only TZ survives).
# Declare every var Lua reads via os.getenv so it crosses the master→worker
# fork. Listing is explicit so accidental new env reads stand out in PRs.
env AGENT_MUX_API_KEYS;
env AGENT_MUX_API_KEYS_FILE;
env AGENT_MUX_HOOKS_DIR;
env AGENT_MUX_HTTP_TOOLS_FILE;
env AGENT_MUX_INLINE_TOOLS_DIR;
env AGENT_MUX_IP_BUCKET_CAPACITY;
env AGENT_MUX_IP_REFILL_PER_SEC;
env AGENT_MUX_MAX_BODY_BYTES;
env AGENT_MUX_MCP_FILE;
env ANTHROPIC_API_KEY;
env ANTHROPIC_URL;
env REDIS_HOST;
env REDIS_PORT;

events {
    worker_connections 1024;
}

http {
    # Keep nginx out of the way of streaming responses.
    sendfile             off;
    tcp_nopush           off;
    tcp_nodelay          on;
    keepalive_timeout    65;

    # Find our Lua modules under $prefix/lua/.
    lua_package_path "$prefix/lua/?.lua;$prefix/lua/?/init.lua;;";

    # `on` is correct for both prod and dev: with cache off, package.loaded
    # is cleared every request, which wipes per-worker state (metrics
    # registry, tool registry, session cache). For Lua edits during dev,
    # restart with `make stop && make dev`.
    lua_code_cache on;

    # Module-local state in workers (script SHAs, registries) is initialised
    # here. Errors at this stage prevent the worker from starting — fail fast.
    init_worker_by_lua_block {
        require("agent_mux").init_worker()
    }

    # Larger buffer so SSE responses don't get cut on big chunks.
    client_max_body_size 4m;

    # Log to stdout in dev so `make dev` is self-contained.
    access_log logs/access.log combined;

    server {
        listen 8080;
        server_name agent_mux;

        # Streaming responses: never buffer.
        proxy_buffering off;

        location = /healthz {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("ok")
            }
        }

        location = /metrics {
            content_by_lua_block {
                require("agent_mux.observability.metrics").write()
            }
        }

        location = /v1/agents {
            access_by_lua_block  { require("agent_mux.server").access()  }
            content_by_lua_block { require("agent_mux.server").content() }
            log_by_lua_block     { require("agent_mux.server").log_phase() }
        }

        location ~ ^/v1/sessions/(?<session_id>[A-Za-z0-9_-]+)$ {
            access_by_lua_block  { require("agent_mux.server").session_access() }
            content_by_lua_block { require("agent_mux.server").handle_session() }
        }

        # Northbound MCP gateway (Streamable-HTTP). Point Claude Code / Codex
        # here: they see every supervised tool behind one policy-enforced,
        # observable MCP endpoint.
        location = /mcp {
            content_by_lua_block { require("agent_mux.server").mcp_gateway() }
        }

        # Supervised MCP server status (JSON, or ?format=text for a table).
        location = /v1/mcp/servers {
            content_by_lua_block { require("agent_mux.server").mcp_status() }
        }

        # Mock Anthropic Messages API for local dev — see examples/mock_anthropic.lua.
        location = /mock/v1/messages {
            content_by_lua_file lua/agent_mux/../../examples/mock_anthropic.lua;
        }

        # Toy HTTP "search" tool service driven by tools/http.lua.
        # See examples/tools/http_search/server.lua.
        location = /mock/tools/search {
            content_by_lua_file lua/agent_mux/../../examples/tools/http_search/server.lua;
        }

        # Catch-all so unknown paths return a clean typed error.
        location / {
            content_by_lua_block {
                require("agent_mux.errors").respond(404, "not_found", "no route")
            }
        }
    }

    # Ops dashboard — localhost-only web UI on a dedicated port, same process.
    # Open http://localhost:7100 to watch the MCP fleet, tool traffic, and logs.
    server {
        listen      127.0.0.1:7100;
        server_name agent_mux_dashboard;
        proxy_buffering off;

        location = / {
            content_by_lua_block { require("agent_mux.dashboard").page() }
        }
        location = /api/health {
            content_by_lua_block { require("agent_mux.dashboard").health() }
        }
        location = /api/status {
            content_by_lua_block { require("agent_mux.dashboard").status() }
        }
        location = /api/logs {
            content_by_lua_block { require("agent_mux.dashboard").logs() }
        }
        location = /api/metrics {
            content_by_lua_block { require("agent_mux.observability.metrics").write() }
        }
        location / {
            content_by_lua_block { require("agent_mux.errors").respond(404, "not_found", "no route") }
        }
    }
}
