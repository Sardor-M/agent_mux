# AgentMux — OpenResty nginx config (dev-biased v0.1).
# Production tuning lives in docs/OPERATIONS.md (week 4).

worker_processes  1;
error_log         logs/error.log info;
pid               run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Keep nginx out of the way of streaming responses.
    sendfile             off;
    tcp_nopush           off;
    tcp_nodelay          on;
    keepalive_timeout    65;

    # Find our Lua modules under $prefix/lua/.
    lua_package_path "$prefix/lua/?.lua;$prefix/lua/?/init.lua;;";

    # `off` so edits to lua/ pick up without restart during development.
    # Flip to `on` for production via a separate prod config.
    lua_code_cache off;

    # Module-local state in workers (script SHAs, registries) is initialised
    # here. Errors at this stage prevent the worker from starting — fail fast.
    init_worker_by_lua_block {
        require("agent_mux").init_worker()
    }

    # Larger buffer so SSE responses don't get cut on big chunks.
    client_max_body_size 4m;

    # Log to stdout in dev so `make dev` is self-contained.
    access_log logs/access.log combined;

    server {
        listen 8080;
        server_name agent_mux;

        # Streaming responses: never buffer.
        proxy_buffering off;

        location = /healthz {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("ok")
            }
        }

        location = /metrics {
            content_by_lua_block {
                require("agent_mux.observability.metrics").write()
            }
        }

        location = /v1/agents {
            access_by_lua_block  { require("agent_mux.server").access()  }
            content_by_lua_block { require("agent_mux.server").content() }
            log_by_lua_block     { require("agent_mux.server").log_phase() }
        }

        location ~ ^/v1/sessions/(?<session_id>[A-Za-z0-9_-]+)$ {
            content_by_lua_block { require("agent_mux.server").handle_session() }
        }

        # Mock Anthropic Messages API for local dev — see examples/mock_anthropic.lua.
        location = /mock/v1/messages {
            content_by_lua_file lua/agent_mux/../../examples/mock_anthropic.lua;
        }

        # Catch-all so unknown paths return a clean typed error.
        location / {
            content_by_lua_block {
                require("agent_mux.errors").respond(404, "not_found", "no route")
            }
        }
    }
}
